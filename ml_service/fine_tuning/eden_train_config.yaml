# ═══════════════════════════════════════════════════════════════════════
# EDEN LLM — QLoRA Domain Fine-Tuning Configuration
# EduSphere AI-Powered Student Lifecycle Management Ecosystem
# ═══════════════════════════════════════════════════════════════════════

# Base Foundation Model
base_model_name: "google/gemma-2-2b-it"  # Options: Qwen/Qwen2.5-3B-Instruct, meta-llama/Llama-3.2-3B-Instruct
output_dir: "./eden_lora_adapter"

# QLoRA Quantization Parameters
load_in_4bit: true
bnb_4bit_compute_dtype: "bfloat16"
bnb_4bit_quant_type: "nf4"
bnb_4bit_use_double_quant: true

# LoRA Hyperparameters
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
target_modules:
  - "q_proj"
  - "k_proj"
  - "v_proj"
  - "o_proj"
  - "gate_proj"
  - "up_proj"
  - "down_proj"

# Training Hyperparameters
per_device_train_batch_size: 4
gradient_accumulation_steps: 4
learning_rate: 0.0002
weight_decay: 0.01
num_train_epochs: 3
warmup_ratio: 0.05
lr_scheduler_type: "cosine"
max_seq_length: 2048
logging_steps: 10
save_strategy: "epoch"
eval_strategy: "steps"
eval_steps: 50
